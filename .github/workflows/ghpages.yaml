name: Gh-Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build and Deploy to GitHub Pages
        run: |
          flutter config --enable-web
          flutter pub get
          flutter build web --release --wasm --base-href /
          
          # Git configuration
          git config user.name github-actions
          git config user.email github-actions@github.com
          
          # Safe asset restructure
          if [ -d build/web/assets/assets ]; then
            mv build/web/assets/assets/* build/web/assets/ 2>/dev/null || true
            rmdir build/web/assets/assets 2>/dev/null || true
          fi
          
          # Deploying using Git
          git --work-tree build/web add --all
          git --work-tree build/web commit -m "Automatic deployment by GitHub Actions"
          git push origin HEAD:gh-pages --force
        working-directory: ${{ github.workspace }}
        shell: bash
